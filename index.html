<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Carmina's Curry | Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        main {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 1600px;
            object-fit: contain;
            background: #fff;
            box-shadow: 0 4px 22px rgba(0,0,0,0.10);
        }

        /* Rotate menu on mobile */
        @media screen and (max-width: 600px) {
            main {
                padding: 0;
            }

            img {
                position: fixed;
                width: 100vh;
                height: 100vw;
                max-width: none;
                max-height: none;
                object-fit: contain;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <main>
        <img src="meun.jpeg" alt="Carmina's Curry Menu">
    </main>

</body>
</html>
