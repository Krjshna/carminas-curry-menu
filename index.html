<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carmina's Curry Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        .menu-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .menu-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* Mobile landscape display */
        @media screen and (max-width: 768px) {
            .menu-image {
                position: fixed;
                width: 100vh;
                height: 100vw;
                max-width: none;
                max-height: none;
                object-fit: contain;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
            }
        }
    </style>
</head>

<body>

    <div class="menu-container">
        <img
            src="YOUR_IMAGE_URL_OR_BASE64_HERE"
            alt="Carmina's Curry Menu"
            class="menu-image"
        >
    </div>

</body>
</html>
